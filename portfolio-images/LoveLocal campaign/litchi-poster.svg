<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" font-family="'Baloo 2','Fredoka',system-ui,sans-serif">
  <defs>
    <radialGradient id="litchiBody" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#F06A8A"/>
      <stop offset="55%" stop-color="#D62B5A"/>
      <stop offset="100%" stop-color="#A11038"/>
    </radialGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF3DC"/>
      <stop offset="100%" stop-color="#F3E6C4"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="14" y="14" width="572" height="732" rx="40" fill="url(#cardBg)" stroke="#C2117A" stroke-width="10"/>

  <!-- top banner -->
  <rect x="14" y="14" width="572" height="120" rx="40" fill="#C2117A"/>
  <rect x="14" y="94" width="572" height="42" fill="#C2117A"/>
  <text x="300" y="92" text-anchor="middle" fill="#FFC400" font-size="46" font-weight="800" letter-spacing="1">LITCHI STORY</text>

  <!-- yellow burst behind fruit -->
  <g transform="translate(300,400)">
    <g fill="#FFC400">
      <g id="ray"><polygon points="0,-200 22,-120 -22,-120"/></g>
      <use href="#ray" transform="rotate(30)"/>
      <use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)"/>
    </g>
    <circle r="150" fill="#FBF3DC"/>
  </g>

  <!-- litchi fruit -->
  <g transform="translate(300,392)">
    <!-- leaf + stem -->
    <path d="M6 -120 q4 -46 44 -64 q-8 44 -44 64Z" fill="#2E8B57"/>
    <path d="M6 -120 q-4 -40 -40 -56 q6 40 40 56Z" fill="#37A968"/>
    <rect x="0" y="-126" width="8" height="34" rx="4" fill="#7A4A22"/>
    <!-- body -->
    <circle r="118" fill="url(#litchiBody)"/>
    <!-- bumpy skin texture -->
    <g fill="#8C0E30" opacity="0.55">
      <circle cx="-70" cy="-50" r="9"/><circle cx="-38" cy="-72" r="9"/><circle cx="-2" cy="-84" r="9"/>
      <circle cx="34" cy="-72" r="9"/><circle cx="66" cy="-48" r="9"/>
      <circle cx="-86" cy="-12" r="9"/><circle cx="-54" cy="-30" r="9"/><circle cx="-20" cy="-44" r="9"/>
      <circle cx="18" cy="-44" r="9"/><circle cx="52" cy="-30" r="9"/><circle cx="84" cy="-10" r="9"/>
      <circle cx="-92" cy="28" r="9"/><circle cx="-58" cy="12" r="9"/><circle cx="-24" cy="-2" r="9"/>
      <circle cx="14" cy="-2" r="9"/><circle cx="48" cy="12" r="9"/><circle cx="86" cy="30" r="9"/>
      <circle cx="-74" cy="62" r="9"/><circle cx="-40" cy="46" r="9"/><circle cx="-6" cy="36" r="9"/>
      <circle cx="30" cy="46" r="9"/><circle cx="64" cy="60" r="9"/>
      <circle cx="-46" cy="86" r="9"/><circle cx="-10" cy="76" r="9"/><circle cx="26" cy="84" r="9"/>
    </g>
    <!-- highlight -->
    <ellipse cx="-44" cy="-46" rx="30" ry="22" fill="#FF9DB4" opacity="0.6"/>
  </g>

  <!-- bottom strip -->
  <text x="300" y="640" text-anchor="middle" fill="#1C2B4A" font-size="34" font-weight="700">Litchi season, sorted.</text>
  <text x="300" y="690" text-anchor="middle" fill="#C2117A" font-size="24" font-weight="600">Fresh aaj hi · LoveLocal 🛒</text>
</svg>
